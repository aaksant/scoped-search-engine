version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/store/queries"
    schema: "db/migrations"
    gen:
      go:
        package: "sqlc"
        out: "internal/store/sqlc"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "TEXT"
            go_type: "string"
